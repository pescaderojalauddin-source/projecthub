# Профиль "dev" — H2 in-memory, сидинг включён, H2 console доступна.
spring:
  datasource:
    url: jdbc:h2:mem:projecthub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # none вместо validate: Hibernate-Envers использует TINYINT для revtype,
      # а Flyway-миграция V3 использует портируемый SMALLINT (PG не поддерживает TINYINT).
      # Реальную validate-проверку выполняет PostgresContainerIT на настоящем PG.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console

projecthub:
  seed:
    enabled: true
