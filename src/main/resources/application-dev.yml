# Профиль "dev" — H2 in-memory, сидинг включён, H2 console доступна.
spring:
  datasource:
    url: jdbc:h2:mem:projecthub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

projecthub:
  seed:
    enabled: true
