<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Профиль — ProjectHub')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/projects}">Главная</a></li>
            <li class="breadcrumb-item active">Профиль</li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-3 d-flex justify-content-center">
                        <span th:replace="~{fragments/avatar :: avatar(${user.login}, 'lg')}">A</span>
                    </div>
                    <h2 class="h4 mb-1" th:text="${user.login}">login</h2>
                    <span class="badge"
                          th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${user.role.name()}">USER</span>
                    <hr>
                    <dl class="row mb-0 small text-muted">
                        <dt class="col-5 text-end">ID:</dt>
                        <dd class="col-7 text-start" th:text="${user.id}">1</dd>
                        <dt class="col-5 text-end">Создан:</dt>
                        <dd class="col-7 text-start"
                            th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">—</dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3"><i class="bi bi-key"></i> Смена пароля</h2>

                    <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" novalidate>
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="currentPassword">Текущий пароль</label>
                            <input id="currentPassword" type="password" th:field="*{currentPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="newPassword">Новый пароль</label>
                            <input id="newPassword" type="password" th:field="*{newPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                            <div class="form-text">От 6 до 100 символов.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="newPasswordConfirm">Повтор нового пароля</label>
                            <input id="newPasswordConfirm" type="password" th:field="*{newPasswordConfirm}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{newPasswordConfirm}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сменить пароль
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Учёт времени -->
    <div class="card shadow-sm mt-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">
                <i class="bi bi-stopwatch"></i> Учёт рабочего времени
            </span>
            <span class="small text-muted">
                Сегодня: <strong th:text="${timerService.format(totalSecondsToday)}">0м</strong>
                · 7 дней: <strong th:text="${timerService.format(totalSecondsLast7Days)}">0м</strong>
            </span>
        </div>
        <div class="table-responsive" th:if="${not #lists.isEmpty(timeEntries.content)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Задача</th>
                    <th>Начало</th>
                    <th>Конец</th>
                    <th>Длительность</th>
                    <th>Заметка</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${timeEntries.content}">
                    <td>
                        <a th:href="@{/tasks/{id}(id=${e.task.id})}"
                           th:text="${e.task.title}"
                           class="text-decoration-none fw-semibold"></a>
                    </td>
                    <td class="small" th:text="${#temporals.format(e.startAt, 'dd.MM HH:mm')}"></td>
                    <td class="small">
                        <span th:if="${e.endAt != null}" th:text="${#temporals.format(e.endAt, 'dd.MM HH:mm')}"></span>
                        <span th:if="${e.endAt == null}" class="badge bg-success">идёт</span>
                    </td>
                    <td>
                        <span th:if="${e.durationSeconds != null}"
                              th:text="${timerService.format(e.durationSeconds)}"></span>
                        <span th:if="${e.durationSeconds == null}" class="text-muted">—</span>
                    </td>
                    <td class="small text-muted text-truncate" style="max-width: 320px;"
                        th:text="${e.note}">—</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-body text-muted small" th:if="${#lists.isEmpty(timeEntries.content)}">
            Пока нет записей. Запустите таймер на странице любой задачи.
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
