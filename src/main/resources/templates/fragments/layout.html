<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${title} ?: 'ProjectHub'">ProjectHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Apply persisted theme before content paints to avoid flash of light theme. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('projecthub-theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-bs-theme', saved);
                }
            } catch (e) { /* localStorage unavailable */ }
        })();
    </script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/projects}">
            <i class="bi bi-kanban"></i> ProjectHub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Сегодня</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Проекты</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/stats}">Статистика</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/audit}">Аудит</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">API</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item d-none me-2" id="navTimer" sec:authorize="isAuthenticated()">
                    <a class="navbar-timer d-inline-flex align-items-center gap-2 px-2 py-1 rounded"
                       href="#" id="navTimerLink" title="Активный таймер">
                        <span class="timer-pulse"></span>
                        <span class="font-monospace small" id="navTimerClock">00:00:00</span>
                        <span class="small text-truncate d-none d-lg-inline" id="navTimerTitle"
                              style="max-width: 180px;"></span>
                    </a>
                    <form method="post" th:action="@{/timer/stop}" class="d-inline">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-outline-light ms-1"
                                title="Остановить таймер">
                            <i class="bi bi-stop-fill"></i>
                        </button>
                    </form>
                </li>
                <li class="nav-item">
                    <button id="themeToggle" type="button"
                            class="btn btn-sm btn-outline-light me-2"
                            title="Переключить тему">
                        <i class="bi bi-moon-stars-fill" id="themeToggleIcon"></i>
                    </button>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-inline-flex align-items-center gap-2"
                       data-bs-toggle="dropdown" href="#">
                        <span th:replace="~{fragments/avatar :: avatar(${#authentication.name}, 'sm')}">A</span>
                        <span sec:authentication="name">user</span>
                        <span class="badge bg-secondary"
                              sec:authentication="principal.authorities">[ROLE]</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <i class="bi bi-person"></i> Профиль
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-box-arrow-right"></i> Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="flash-toasts" th:if="${flashSuccess != null or flashError != null}">
    <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${flashSuccess}">OK</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${flashError}">ERR</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="pagination(page, baseHref)" th:if="${page.totalPages > 1}" class="mt-3">
    <nav aria-label="Pagination">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${baseHref + (baseHref.contains('?') ? '&' : '?') + 'page=' + (page.number - 1) + '&size=' + page.size}">
                    Назад
                </a>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${baseHref + (baseHref.contains('?') ? '&' : '?') + 'page=' + (page.number + 1) + '&size=' + page.size}">
                    Вперёд
                </a>
            </li>
        </ul>
    </nav>
</div>

<footer th:fragment="footer" class="footer mt-auto py-3">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 small text-muted">
        <span>
            <i class="bi bi-kanban"></i>
            ProjectHub © 2026 — Курсовой проект
        </span>
        <span>
            Создатель: <span class="credit-name">Муратов Андрей</span>. Проект в Naumen.
        </span>
    </div>
</footer>

<div th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        (function () {
            var btn = document.getElementById('themeToggle');
            var icon = document.getElementById('themeToggleIcon');
            if (!btn || !icon) return;
            var html = document.documentElement;
            function syncIcon() {
                var dark = html.getAttribute('data-bs-theme') === 'dark';
                icon.classList.toggle('bi-moon-stars-fill', !dark);
                icon.classList.toggle('bi-sun-fill', dark);
            }
            syncIcon();
            btn.addEventListener('click', function () {
                var next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-bs-theme', next);
                try { localStorage.setItem('projecthub-theme', next); } catch (e) { /* ignore */ }
                syncIcon();
            });
        })();

        // Live timer counters: any element with data-timer-since="ISO_LOCAL_DATETIME"
        // gets its text updated every second to "HH:MM:SS" since that timestamp.
        (function () {
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function fmtElapsed(seconds) {
                if (seconds < 0) seconds = 0;
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                var s = seconds % 60;
                return pad(h) + ':' + pad(m) + ':' + pad(s);
            }
            function tick() {
                var nodes = document.querySelectorAll('[data-timer-since]');
                if (!nodes.length) return;
                var now = Date.now();
                nodes.forEach(function (node) {
                    var iso = node.getAttribute('data-timer-since');
                    if (!iso) return;
                    var t = Date.parse(iso);
                    if (isNaN(t)) return;
                    var elapsed = Math.floor((now - t) / 1000);
                    node.textContent = fmtElapsed(elapsed);
                });
            }
            tick();
            setInterval(tick, 1000);
        })();

        // Navbar active-timer indicator: polls /timer/active.json every 15s.
        (function () {
            var el = document.getElementById('navTimer');
            if (!el) return;
            var clock = document.getElementById('navTimerClock');
            var title = document.getElementById('navTimerTitle');
            var link = document.getElementById('navTimerLink');
            var ctxBase = /*[[@{/}]]*/ '/';
            var apiUrl = ctxBase + 'timer/active.json';
            var startedAtMs = null;
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function fmt(seconds) {
                if (seconds < 0) seconds = 0;
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                var s = seconds % 60;
                return pad(h) + ':' + pad(m) + ':' + pad(s);
            }
            function render() {
                if (startedAtMs == null) {
                    el.classList.add('d-none');
                    return;
                }
                el.classList.remove('d-none');
                clock.textContent = fmt(Math.floor((Date.now() - startedAtMs) / 1000));
            }
            function poll() {
                fetch(apiUrl, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        if (!data || !data.active) {
                            startedAtMs = null;
                            el.classList.add('d-none');
                            return;
                        }
                        var t = Date.parse(data.startedAt);
                        startedAtMs = isNaN(t) ? Date.now() - (data.seconds * 1000) : t;
                        title.textContent = data.taskTitle || '';
                        if (link) link.setAttribute('href', ctxBase + 'tasks/' + data.taskId);
                        render();
                    })
                    .catch(function () { /* ignore network blips */ });
            }
            poll();
            setInterval(render, 1000);
            setInterval(poll, 15000);
        })();
        /*]]>*/
    </script>
</div>
</body>
</html>
