<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <title th:text="${title} ?: 'ProjectHub'">ProjectHub</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- Тёмная тема: берём сохранённый выбор из localStorage до первого рендера,
         чтобы не было вспышки светлой версии (FOUC). -->
    <script th:inline="javascript">/*<![CDATA[*/
        (function () {
            try {
                var saved = localStorage.getItem('projecthub-theme');
                if (!saved) {
                    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', saved);
            } catch (e) { /* no-op */ }
        })();
    /*]]>*/</script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/projects}">
            <i class="bi bi-kanban"></i> ProjectHub
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Проекты</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/stats}">Статистика</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank">API</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item me-lg-2">
                    <button id="themeToggle" type="button"
                            class="btn btn-sm btn-outline-light"
                            aria-label="Переключить тему" title="Переключить тему">
                        <i id="themeToggleIcon" class="bi bi-moon-stars"></i>
                    </button>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">user</span>
                        <span class="badge bg-secondary ms-1"
                              sec:authentication="principal.authorities">[ROLE]</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-box-arrow-right"></i> Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="container mt-3">
    <div th:if="${flashSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${flashSuccess}">OK</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${flashError}">ERR</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="pagination(page, baseHref)" th:if="${page.totalPages > 1}" class="mt-3">
    <nav aria-label="Pagination">
        <ul class="pagination justify-content-center mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="${baseHref + (baseHref.contains('?') ? '&' : '?') + 'page=' + (page.number - 1) + '&size=' + page.size}">
                    Назад
                </a>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="${baseHref + (baseHref.contains('?') ? '&' : '?') + 'page=' + (page.number + 1) + '&size=' + page.size}">
                    Вперёд
                </a>
            </li>
        </ul>
    </nav>
</div>

<footer th:fragment="footer" class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center text-muted small">
        <span>ProjectHub © 2026 — Курсовой проект</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/theme.js}"></script>
</th:block>
</body>
</html>
