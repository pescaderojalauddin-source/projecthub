<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Доска — ' + ${project.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container-fluid py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/projects}">Проекты</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.title}">Project</a>
            </li>
            <li class="breadcrumb-item active">Доска</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0"><i class="bi bi-kanban"></i> <span th:text="${project.title}"></span></h1>
        <div class="btn-group" role="group">
            <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-list-ul"></i> Список
            </a>
            <a th:href="@{/projects/{id}/tasks/new(id=${project.id})}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Задача
            </a>
        </div>
    </div>

    <div class="kanban-board row g-3">
        <div th:each="status : ${statuses}" class="col-12 col-md-4">
            <div class="kanban-column card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="badge status-badge"
                          th:classappend="${status.name().toLowerCase().replace('_', '-')}"
                          th:text="${status.label}">Status</span>
                    <span class="text-muted small"
                          th:text="${grouped.get(status).size()}">0</span>
                </div>
                <div class="card-body kanban-list" th:attr="data-status=${status.name()}">
                    <div th:each="task : ${grouped.get(status)}"
                         class="kanban-card card mb-2"
                         th:attr="data-task-id=${task.id}">
                        <div class="card-body p-2">
                            <a class="text-decoration-none stretched-link"
                               th:href="@{/tasks/{id}(id=${task.id})}"
                               th:text="${task.title}">Task</a>
                            <div class="text-muted small mt-1 d-flex justify-content-between">
                                <span th:if="${task.assignee != null}"
                                      th:text="${task.assignee.login}">user</span>
                                <span th:if="${task.assignee == null}" class="fst-italic">не назначена</span>
                                <span th:if="${task.deadline != null}"
                                      th:text="${#temporals.format(task.deadline, 'dd.MM')}">01.01</span>
                            </div>
                        </div>
                    </div>
                    <div th:if="${grouped.get(status).isEmpty()}"
                         class="text-muted small text-center py-3 fst-italic">
                        Перетащите задачу сюда
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/webjars/sortablejs/1.15.2/Sortable.min.js}"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    (function () {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
        const tasksBase = /*[[@{/tasks/}]]*/ '/tasks/';
        document.querySelectorAll('.kanban-list').forEach(function (column) {
            new Sortable(column, {
                group: 'kanban',
                animation: 150,
                ghostClass: 'kanban-card-ghost',
                onEnd: function (evt) {
                    const taskId = evt.item.dataset.taskId;
                    const newStatus = evt.to.dataset.status;
                    if (!taskId || !newStatus) return;
                    const body = new URLSearchParams();
                    body.append('status', newStatus);
                    const headers = { 'Accept': 'application/json' };
                    if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
                    fetch(tasksBase + encodeURIComponent(taskId) + '/status-ajax', {
                        method: 'POST',
                        headers: headers,
                        body: body
                    }).then(function (res) {
                        if (!res.ok) {
                            window.location.reload();
                        }
                    }).catch(function () {
                        window.location.reload();
                    });
                }
            });
        });
    })();
    /*]]>*/
</script>
</body>
</html>
