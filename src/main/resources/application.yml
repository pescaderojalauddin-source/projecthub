spring:
  application:
    name: projecthub
  profiles:
    active: dev
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    open-in-view: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.projecthub: DEBUG

projecthub:
  seed:
    enabled: true
