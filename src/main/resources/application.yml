spring:
  application:
    name: projecthub
  profiles:
    active: dev
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  jpa:
    # Выключено: ленивая загрузка ассоциаций после транзакции рантайма должна быть осознанным
    # действием. N+1 закрываем @EntityGraph в репозиториях. См. ProjectRepository / TaskRepository.
    open-in-view: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JavaMelody — мониторинг по /monitoring (требует роль ADMIN, см. SecurityConfig)
javamelody:
  enabled: true
  init-parameters:
    monitoring-path: /monitoring

logging:
  level:
    root: INFO
    com.example.projecthub: DEBUG

projecthub:
  seed:
    enabled: true
  uploads:
    dir: ${PROJECTHUB_UPLOADS_DIR:uploads}
  notifications:
    email:
      enabled: ${PROJECTHUB_EMAIL_ENABLED:false}
      from: ${PROJECTHUB_EMAIL_FROM:no-reply@projecthub.local}
      cron: ${PROJECTHUB_EMAIL_CRON:0 0 8 * * *}
