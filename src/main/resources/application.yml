spring:
  application:
    name: projecthub
  profiles:
    active: dev
  thymeleaf:
    cache: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    open-in-view: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JavaMelody — мониторинг производительности (только под ROLE_ADMIN на /monitoring).
javamelody:
  enabled: true
  init-parameters:
    monitoring-path: /monitoring
    log: true
    storage-directory: ${java.io.tmpdir}/projecthub-melody
    no-database: false
    excluded-http-request-paths: /actuator/.*,/css/.*,/js/.*,/webjars/.*,/favicon\.ico,/h2-console/.*

logging:
  level:
    root: INFO
    com.example.projecthub: DEBUG

projecthub:
  seed:
    enabled: true
