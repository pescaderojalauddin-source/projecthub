# Профиль "postgres" — PostgreSQL 14+.
# Параметры подключения берутся из переменных окружения. Поддерживаются три варианта:
#   1) Прямой JDBC URL:           SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/db
#   2) По частям (Render и т.п.): DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
#   3) Локально (docker-compose): значения по умолчанию из docker-compose.yml.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projecthub}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:projecthub}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:projecthub}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

projecthub:
  seed:
    enabled: ${PROJECTHUB_SEED_ENABLED:true}
