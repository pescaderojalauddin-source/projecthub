spring:
  datasource:
    # Без MODE=PostgreSQL: Hibernate-Envers генерирует revtype как TINYINT, который H2
    # отвергает в PG-моде. Реальную PG-совместимость покрывают Testcontainers-тесты
    # (PostgresContainerIT).
    url: jdbc:h2:mem:projecthub-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  thymeleaf:
    cache: false

projecthub:
  seed:
    enabled: false
